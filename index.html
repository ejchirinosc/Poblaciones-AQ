<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bitácora de Piscinas</title>
<meta name="theme-color" content="#0E7C7B">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EAF1EE; --surface:#FFFFFF; --surface-2:#DCEAE5;
    --ink:#0F2E29; --ink-muted:#5C7B75;
    --teal:#0E7C7B; --teal-dark:#084F4F; --teal-light:#CFE8E4; --teal-soft:#E4F2EF;
    --amber:#B45309; --amber-light:#FBEAD3;
    --green:#177A45; --green-light:#DEF0E3;
    --red:#B3261E; --red-light:#FBE4E1;
    --radius:16px;
    --mono:'IBM Plex Mono','SF Mono',Menlo,monospace;
    --sans:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans);}
  #app-root{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);position:relative;}

  .appbar{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--teal-dark),var(--teal) 70%);
    padding:18px 16px 26px;border-radius:0 0 22px 22px;box-shadow:0 4px 14px rgba(8,79,79,.25);}
  .appbar-row{display:flex;align-items:flex-start;justify-content:space-between;}
  .appbar-title h1{font-family:var(--mono);font-size:17px;font-weight:700;margin:0;color:#fff;letter-spacing:.01em;}
  .appbar-title .sub{font-size:11.5px;color:rgba(255,255,255,.78);font-family:var(--mono);margin-top:2px;display:block;}
  .icon-btn{width:38px;height:38px;border-radius:11px;border:none;background:rgba(255,255,255,.16);
    display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
  .icon-btn:active{background:rgba(255,255,255,.28);}
  .icon-btn svg{width:19px;height:19px;stroke:#fff;}
  .wave{display:block;margin-top:10px;height:14px;width:100%;}
  .wave path{fill:var(--bg);}

  #content{flex:1;overflow-y:auto;padding:14px 16px 92px;margin-top:-12px;}

  .tabbar{position:sticky;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--surface-2);
    display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));}
  .tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;
    background:none;border:none;color:var(--ink-muted);font-family:var(--sans);font-size:10.5px;font-weight:600;
    border-radius:10px;cursor:pointer;}
  .tab-btn svg{width:20px;height:20px;stroke:var(--ink-muted);fill:none;stroke-width:1.8;}
  .tab-btn.active{color:var(--teal-dark);background:var(--teal-light);}
  .tab-btn.active svg{stroke:var(--teal-dark);}

  h2.section-title{font-family:var(--mono);font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--ink-muted);margin:0 0 10px;}

  .card{background:var(--surface);border-radius:var(--radius);padding:16px;margin-bottom:12px;
    box-shadow:0 1px 3px rgba(15,46,41,.08);border:1px solid rgba(15,46,41,.04);}
  .card.accent{border-left:4px solid var(--teal);}
  .card.accent-closed{border-left:4px solid var(--ink-muted);}
  .card-header{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:10px;}
  .card-header h3{margin:0;font-family:var(--mono);font-size:16px;font-weight:700;}
  .card-header .muted{font-size:12px;color:var(--ink-muted);margin-top:2px;}

  .pill{display:inline-flex;align-items:center;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;
    font-family:var(--mono);}
  .pill.good{background:var(--green-light);color:var(--green);}
  .pill.warn{background:var(--amber-light);color:var(--amber);}
  .pill.neutral{background:var(--surface-2);color:var(--ink-muted);}
  .pill.closed{background:var(--surface-2);color:var(--ink-muted);}

  .field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
  .field label{font-size:11px;font-weight:700;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.04em;}
  input,select{padding:12px;border:1.5px solid var(--surface-2);border-radius:10px;font-size:16px;
    font-family:var(--sans);background:var(--surface);color:var(--ink);width:100%;}
  input:focus,select:focus{outline:2px solid var(--teal);outline-offset:1px;border-color:var(--teal);}
  .row{display:flex;gap:10px;}
  .row > .field{flex:1;}

  .btn{padding:13px 18px;border-radius:11px;font-weight:700;border:none;cursor:pointer;font-size:14.5px;
    font-family:var(--sans);width:100%;}
  .btn-primary{background:var(--teal);color:#fff;}
  .btn-primary:active{background:var(--teal-dark);}
  .btn-secondary{background:var(--surface-2);color:var(--ink);}
  .btn-outline{background:none;border:1.5px solid var(--surface-2);color:var(--ink);}
  .btn-danger-outline{background:none;border:1.5px solid var(--red-light);color:var(--red);}
  .btn-sm{width:auto;padding:9px 14px;font-size:13px;}

  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0;}
  .stat-grid.cols-3{grid-template-columns:1fr 1fr 1fr;}
  .stat{background:var(--teal-soft);border-radius:10px;padding:9px 11px;}
  .stat .value{font-family:var(--mono);font-size:17px;font-weight:700;line-height:1.3;}
  .stat .label{font-size:9.5px;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.03em;}

  .waterbar-cap{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-muted);
    font-family:var(--mono);margin-bottom:4px;}
  .waterbar{position:relative;height:11px;border-radius:6px;background:var(--surface-2);overflow:visible;}
  .waterbar-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--teal-dark));border-radius:6px;
    transition:width .4s;}
  .waterbar-tick{position:absolute;top:-2px;width:2px;height:15px;background:var(--ink);opacity:.28;border-radius:1px;}

  .list-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;
    border-bottom:1px solid var(--bg);font-size:14px;}
  .list-row:last-child{border-bottom:none;}
  .list-row .rowmain{font-family:var(--mono);font-weight:600;}
  .list-row .rowsub{font-size:11px;color:var(--ink-muted);}
  .x-btn{width:26px;height:26px;border-radius:8px;border:none;background:var(--red-light);color:var(--red);
    font-size:15px;line-height:1;cursor:pointer;flex-shrink:0;}

  .empty-state{text-align:center;padding:50px 16px;color:var(--ink-muted);}
  .empty-state svg{width:40px;height:40px;stroke:var(--ink-muted);margin-bottom:12px;}
  .empty-state p{margin:4px 0;font-size:13.5px;}

  .add-fab{position:fixed;left:50%;transform:translateX(calc(-50% + 210px));bottom:76px;z-index:15;}
  .add-fab button{width:52px;height:52px;border-radius:16px;border:none;background:var(--teal);color:#fff;
    font-size:26px;box-shadow:0 4px 10px rgba(8,79,79,.35);cursor:pointer;}

  .modal-overlay{position:fixed;inset:0;background:rgba(15,46,41,.45);display:flex;align-items:flex-end;
    justify-content:center;z-index:50;}
  .modal-sheet{background:var(--surface);width:100%;max-width:480px;border-radius:20px 20px 0 0;
    padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;}
  .modal-sheet h3{font-family:var(--mono);margin:0 0 14px;font-size:16px;}
  .modal-actions{display:flex;gap:10px;margin-top:6px;}

  .toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:#fff;
    padding:9px 16px;border-radius:999px;font-size:12.5px;font-family:var(--mono);z-index:60;opacity:0;
    transition:opacity .25s;pointer-events:none;max-width:88%;text-align:center;}
  .toast.show{opacity:1;}

  .mini-chart{width:100%;height:auto;}
  .mini-chart .axis{stroke:var(--surface-2);stroke-width:1.5;}
  .mini-chart .axis-label{font-family:var(--mono);font-size:9px;fill:var(--ink-muted);}

  .chip-select{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;}
  .chip{flex-shrink:0;padding:8px 14px;border-radius:999px;background:var(--surface);border:1.5px solid var(--surface-2);
    font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--ink-muted);cursor:pointer;}
  .chip.active{background:var(--teal);border-color:var(--teal);color:#fff;}
  .chip.closed-chip{opacity:.75;}

  .legend-note{font-size:11px;color:var(--ink-muted);line-height:1.5;margin-top:2px;}
  .divider{height:1px;background:var(--surface-2);margin:14px 0;}
  .stats-panel{background:var(--bg);border-radius:12px;padding:12px;margin-top:10px;}
  .stats-panel .stat-grid{margin:8px 0 4px;}

  .pond-wrap{cursor:pointer;touch-action:manipulation;position:relative;}
  .pond-svg{width:100%;height:auto;display:block;border-radius:16px;}
  .pending-marker{animation:pulse 1.1s infinite;}
  @keyframes pulse{0%{opacity:1;}50%{opacity:.3;}100%{opacity:1;}}
  .pond-hint{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;}
  .pond-hint span{font-size:11.5px;color:var(--ink-muted);}
  .pond-hint span.marked{color:var(--amber);font-weight:600;}

  .pond-strip{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px;margin-bottom:2px;}
  .pond-strip-item{flex-shrink:0;width:118px;text-align:center;}
  .pond-strip-item .pond-svg{border-radius:12px;}
  .pond-strip-day{font-family:var(--mono);font-size:10px;color:var(--ink-muted);margin-bottom:5px;}
  .pond-strip-val{font-family:var(--mono);font-weight:700;font-size:13px;margin-top:5px;}

  .pond-table{background:linear-gradient(135deg,var(--teal-soft),var(--surface-2));border:2px solid var(--teal);
    border-radius:16px;padding:10px;}
  .grid-cells{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
  .grid-cell{position:relative;border-radius:10px;padding:14px 4px 6px;display:flex;flex-direction:column;gap:4px;
    transition:background .3s;}
  .grid-cell-num{position:absolute;top:3px;left:6px;font-size:9px;font-family:var(--mono);color:var(--ink-muted);font-weight:700;}
  .grid-cell input{padding:6px 3px;font-size:12.5px;text-align:center;border-radius:6px;
    border:1px solid rgba(15,46,41,.18);background:#fff;width:100%;}
  .grid-cell input.gc-captura{font-weight:700;}
  .grid-cell input.gc-prof{font-size:10.5px;color:var(--ink-muted);}

  .photo-btn{display:flex;align-items:center;justify-content:center;gap:8px;}
  .photo-preview{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--surface-2);}
  .photo-preview img{width:100%;display:block;max-height:260px;object-fit:cover;}
  .photo-remove{position:absolute;top:8px;right:8px;width:28px;height:28px;}
  .photo-thumb{width:52px;height:52px;border-radius:10px;object-fit:cover;flex-shrink:0;}
</style>
</head>
<body>

<div id="app-root">
  <header class="appbar">
    <div class="appbar-row">
      <div class="appbar-title">
        <h1>Bitácora de Piscinas</h1>
        <span class="sub" id="header-sub">Registro de campo</span>
      </div>
      <button class="icon-btn" data-action="open-settings" aria-label="Ajustes">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </div>
    <svg class="wave" viewBox="0 0 400 14" preserveAspectRatio="none"><path d="M0 8 Q 25 0 50 8 T 100 8 T 150 8 T 200 8 T 250 8 T 300 8 T 350 8 T 400 8 V14 H0 Z"></path></svg>
  </header>

  <main id="content"></main>

  <nav class="tabbar" id="tabbar">
    <button class="tab-btn" data-action="switch-tab" data-tab="piscinas">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"></rect><path d="M6 12c1.5-1.5 3-1.5 4.5 0s3 1.5 4.5 0 3-1.5 4.5 0"></path></svg>
      Piscinas
    </button>
    <button class="tab-btn" data-action="switch-tab" data-tab="muestreo">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M12 3v18M3 12h18M6 6l12 12M18 6L6 18"></path></svg>
      Muestreo
    </button>
    <button class="tab-btn" data-action="switch-tab" data-tab="resumen">
      <svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"></rect><path d="M8 8h8M8 12h8M8 16h5"></path></svg>
      Resumen
    </button>
    <button class="tab-btn" data-action="switch-tab" data-tab="historial">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3.5 2"></path></svg>
      Historial
    </button>
  </nav>
</div>

<div id="modal-root"></div>
<div id="toast" class="toast"></div>

<script>
(function(){
  "use strict";

  const state = {
    farmId: null,
    piscinas: [], ciclos: [], poblaciones: [],
    parametros: { radioAtarraya: 2.44, eficiencia: 0.4, minSobrevivencia: 0.75, minCrecimiento: 2.6, minKgHa: 1700, maxCV: 30 },
    currentTab: "piscinas",
    session: { piscinaId: null, fecha: todayISO() },
    historialSel: { piscinaId: null, cicloId: null },
    editingPiscinaId: null,
    editingCicloPiscinaId: null,
    editingCicloId: null,
    loaded: false,
    loadError: false,
    photoStatus: null,
    fotos: {},
    diagStatus: null,
    backupConfig: { url: null, lastBackup: null },
  };

  function uid(){ return (crypto.randomUUID ? crypto.randomUUID() : "id-"+Date.now()+"-"+Math.random().toString(16).slice(2)); }
  function todayISO(){ return new Date().toISOString().slice(0,10); }
  function fmtPct(v){ return v==null||isNaN(v) ? "—" : (v*100).toFixed(1)+"%"; }
  function fmtNum(v,dec){ return v==null||isNaN(v) ? "—" : Number(v).toLocaleString("es-EC",{maximumFractionDigits: dec==null?1:dec, minimumFractionDigits:0}); }
  function fmtDate(iso){ if(!iso) return "—"; const p=iso.split("-"); return p[2]+"/"+p[1]+"/"+p[0]; }
  function daysBetween(a,b){ return Math.round((new Date(b+"T00:00:00") - new Date(a+"T00:00:00"))/86400000); }
  function escapeHtml(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

  // ---------- estadística: media, mediana, moda, desviación, coeficiente de variación ----------
  function stats(arr){
    const nums = arr.map(Number).filter(v=>!isNaN(v));
    const n = nums.length;
    if (!n) return {n:0, mean:null, median:null, moda:null, std:null, cv:null};
    const mean = nums.reduce((a,b)=>a+b,0)/n;
    const sorted = [...nums].sort((a,b)=>a-b);
    const mid = Math.floor(n/2);
    const median = n%2 ? sorted[mid] : (sorted[mid-1]+sorted[mid])/2;
    const freq = {};
    nums.forEach(v=>freq[v]=(freq[v]||0)+1);
    let maxFreq = 0, modes = [];
    Object.keys(freq).forEach(k=>{ const v=freq[k]; if (v>maxFreq){maxFreq=v; modes=[Number(k)];} else if (v===maxFreq) modes.push(Number(k)); });
    const moda = (maxFreq>1 && modes.length<n) ? modes.sort((a,b)=>a-b) : null;
    const variance = n>1 ? nums.reduce((s,v)=>s+Math.pow(v-mean,2),0)/(n-1) : 0;
    const std = Math.sqrt(variance);
    const cv = mean ? (std/mean)*100 : null;
    return {n, mean, median, moda, std, cv};
  }
  function fmtModa(moda){ return moda ? moda.map(m=>fmtNum(m,0)).join(", ") : "—"; }

  // ---------- correlación captura-profundidad (Pearson) ----------
  function pearsonCorr(xs, ys){
    const n = xs.length;
    if (n < 3) return null;
    const mx = xs.reduce((a,b)=>a+b,0)/n, my = ys.reduce((a,b)=>a+b,0)/n;
    let num=0, dx2=0, dy2=0;
    for (let i=0;i<n;i++){ const dx=xs[i]-mx, dy=ys[i]-my; num += dx*dy; dx2 += dx*dx; dy2 += dy*dy; }
    const den = Math.sqrt(dx2*dy2);
    return den ? num/den : null;
  }
  function corrLabel(r){
    if (r==null) return "Sin datos suficientes";
    const abs = Math.abs(r);
    const fuerza = abs<0.2 ? "muy débil" : abs<0.4 ? "débil" : abs<0.6 ? "moderada" : abs<0.8 ? "fuerte" : "muy fuerte";
    const signo = r>0.02 ? "positiva (a más profundidad, más captura)" : r<-0.02 ? "negativa (a más profundidad, menos captura)" : "prácticamente nula";
    return "Correlación "+fuerza+(Math.abs(r)>=0.02?" y "+signo:"");
  }
  function paresCapturaProfundidad(pob){
    return tirosLlenos(pob).filter(t=>t.profundidad!=null && t.profundidad!=="" && !isNaN(Number(t.profundidad)));
  }

  // ---------- almacenamiento ----------
  // ---- versión con Firebase: usa Firestore (sincroniza entre dispositivos, con caché offline) ----
  let db = null;
  let firebaseReady = false;

  async function tryConnectFirebase(config, farmId){
    try{
      if (firebase.apps && firebase.apps.length){
        await Promise.all(firebase.apps.map(function(a){ return a.delete().catch(function(){}); }));
      }
      firebase.initializeApp(config);
      db = firebase.firestore();
      try{ await db.enablePersistence({ synchronizeTabs:true }); }catch(e){ /* ya habilitado en otra pestaña, ignorar */ }
      await firebase.auth().signInAnonymously();
      firebaseReady = true;
      state.farmId = farmId;
      return {ok:true};
    }catch(e){
      console.error("firebase connect error", e);
      firebaseReady = false;
      return {ok:false, error: (e && e.message) ? e.message : String(e)};
    }
  }

  function renderFirebaseSetup(errorMsg){
    document.getElementById("content").innerHTML = '<div class="card" style="margin-top:20px;">'
      + '<h3 style="font-family:var(--mono);margin-top:0;">Conectar con Firebase</h3>'
      + '<p class="legend-note">Pega la configuración de tu proyecto de Firebase (la que copias al agregar una app web en la consola) y elige un identificador para tu granja — úsalo igual en todos tus dispositivos para que compartan los mismos datos.</p>'
      + '<div class="field"><label>Configuración (JSON)</label><textarea id="fb-config-input" rows="7" style="width:100%;font-family:var(--mono);font-size:12px;padding:10px;border-radius:10px;border:1.5px solid var(--surface-2);" placeholder=\'{"apiKey":"...","authDomain":"...","projectId":"...","storageBucket":"...","messagingSenderId":"...","appId":"..."}\'></textarea></div>'
      + '<div class="field"><label>ID de granja</label><input type="text" id="fb-farmid-input" placeholder="ej. camaronera-jose-01"></div>'
      + (errorMsg ? '<div class="legend-note" style="color:var(--red);margin-bottom:8px;">'+escapeHtml(errorMsg)+'</div>' : "")
      + '<button class="btn btn-primary" data-action="fb-connect">Conectar</button>'
      + '</div>';
  }

  function parseFirebaseConfigInput(raw){
    const starts = [];
    for (let i=0;i<raw.length;i++){ if (raw[i]==="{") starts.push(i); }
    for (const start of starts){
      let depth = 0, end = -1;
      for (let i=start;i<raw.length;i++){
        if (raw[i]==="{") depth++;
        else if (raw[i]==="}"){ depth--; if (depth===0){ end=i; break; } }
      }
      if (end===-1) continue;
      const candidate = raw.slice(start, end+1);
      if (!/apiKey/.test(candidate)) continue; // no es el bloque de configuración (ej. "{ initializeApp }" del import)
      try{ return JSON.parse(candidate); }catch(e){}
      try{
        const obj = (new Function("return (" + candidate + ");"))();
        if (obj && typeof obj === "object" && obj.apiKey) return obj;
      }catch(e2){ /* seguir probando otros bloques */ }
    }
    throw new Error("No encontré un bloque { ... } con 'apiKey' en lo que pegaste. Copia el objeto firebaseConfig completo (incluye la línea apiKey).");
  }

  async function handleFirebaseConnect(){
    const raw = (document.getElementById("fb-config-input").value || "").trim();
    const farmId = (document.getElementById("fb-farmid-input").value || "").trim();
    if (!raw || !farmId){ renderFirebaseSetup("Completa la configuración y el ID de granja."); return; }
    let config;
    try{ config = parseFirebaseConfigInput(raw); }
    catch(e){ renderFirebaseSetup(e.message); return; }
    if (!config.apiKey || !config.projectId){ renderFirebaseSetup("Falta apiKey o projectId — revisa que copiaste el objeto completo."); return; }
    document.getElementById("content").innerHTML = '<div class="empty-state"><p>Conectando…</p></div>';
    const r = await tryConnectFirebase(config, farmId);
    if (!r.ok){ renderFirebaseSetup("No se pudo conectar: "+r.error); return; }
    localStorage.setItem("fb_config", JSON.stringify(config));
    localStorage.setItem("fb_farmId", farmId);
    await loadAll();
    render();
  }

  async function storageGet(key, fallback){
    if (!firebaseReady) return fallback;
    try{
      const snap = await fbCol().doc(key).get();
      return snap.exists ? JSON.parse(snap.data().json) : fallback;
    }catch(e){ console.error("firestore get error", key, e); return fallback; }
  }
  async function storageSetVerbose(key, value){
    if (!firebaseReady) return {ok:false, error:"Firebase no está conectado todavía."};
    try{
      await fbCol().doc(key).set({ json: JSON.stringify(value), updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
      return {ok:true};
    }catch(e){ console.error("firestore set error", key, e); return {ok:false, error: (e && e.message) ? e.message : String(e)}; }
  }
  async function storageSet(key, value){
    const r = await storageSetVerbose(key, value);
    if (!r.ok) showToast("No se pudo guardar: "+(r.error||"revisa tu conexión"));
    return r.ok;
  }
  async function storageDelete(key){

    try{ await fbCol().doc(key).delete(); return true; }
    catch(e){ return false; }
  }

  function hexToRgb(hex){ hex=hex.replace("#",""); return {r:parseInt(hex.slice(0,2),16), g:parseInt(hex.slice(2,4),16), b:parseInt(hex.slice(4,6),16)}; }
  function interpolateColor(hex1, hex2, t){
    const c1=hexToRgb(hex1), c2=hexToRgb(hex2);
    const r=Math.round(c1.r+(c2.r-c1.r)*t), g=Math.round(c1.g+(c2.g-c1.g)*t), b=Math.round(c1.b+(c2.b-c1.b)*t);
    return "rgb("+r+","+g+","+b+")";
  }
  function gridPositions(n){
    const cols = Math.max(1, Math.ceil(Math.sqrt(n)));
    const rows = Math.max(1, Math.ceil(n/cols));
    const pts = [];
    for (let i=0;i<n;i++){
      const col = i%cols, row = Math.floor(i/cols);
      const jx = (Math.random()-0.5)*10, jy = (Math.random()-0.5)*10;
      const x = Math.max(6, Math.min(94, ((col+0.5)/cols)*100 + jx));
      const y = Math.max(6, Math.min(94, ((row+0.5)/rows)*100 + jy));
      pts.push({x, y});
    }
    return pts;
  }

  function gridPositionsAligned(n, cols){
    cols = cols || Math.max(1, Math.min(4, Math.ceil(Math.sqrt(n)) || 1));
    const rows = Math.max(1, Math.ceil(n/cols));
    const pts = [];
    for (let i=0;i<n;i++){
      const col = i%cols, row = Math.floor(i/cols);
      pts.push({x: ((col+0.5)/cols)*100, y: ((row+0.5)/rows)*100});
    }
    return pts;
  }

  }

  function pondDiagram(tiros, opts){
    opts = opts || {};
    const vw = opts.width || 300, vh = opts.height || 190;
    const padX = 16, padY = 16;
    const gradId = "pondGrad-" + (opts.id || Math.random().toString(36).slice(2,8));
    const capturas = tiros.map(t=>Number(t.captura)).filter(v=>!isNaN(v));
    const cMin = capturas.length ? Math.min(...capturas) : 0;
    const cMax = capturas.length ? Math.max(...capturas) : 1;
    const labels = opts.labels !== false;
    const dots = tiros.map((t,i)=>{
      const px = (t.x!=null?t.x:50), py = (t.y!=null?t.y:50);
      const x = padX + (px/100)*(vw-2*padX), y = padY + (py/100)*(vh-2*padY);
      const norm = (cMax>cMin) ? (Number(t.captura)-cMin)/(cMax-cMin) : 0.5;
      const color = interpolateColor("#CFE8E4","#084F4F", norm);
      const r = opts.dotRadius || (vw>200 ? 5+norm*4 : 4+norm*2.4);
      const title = "Tiro "+(i+1)+": "+fmtNum(t.captura,0)+" ind."+(t.profundidad!=null&&t.profundidad!==""?(" · "+fmtNum(t.profundidad,0)+" cm"):"");
      return '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+r.toFixed(1)+'" fill="'+color+'" stroke="#fff" stroke-width="1.2"><title>'+title+'</title></circle>'
        + (labels ? '<text x="'+x.toFixed(1)+'" y="'+(y+2.6).toFixed(1)+'" font-size="7" fill="#fff" text-anchor="middle" font-weight="700" pointer-events="none">'+(i+1)+'</text>' : "");
    }).join("");
    let pending = "";
    if (opts.pendingPoint){
      const x = padX + (opts.pendingPoint.x/100)*(vw-2*padX), y = padY + (opts.pendingPoint.y/100)*(vh-2*padY);
      pending = '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="9" fill="none" stroke="#B45309" stroke-width="2.2" stroke-dasharray="3 2" class="pending-marker"></circle>';
    }
    let overlay = "";
    if (opts.overlayColor){
      overlay = '<rect x="2" y="2" width="'+(vw-4)+'" height="'+(vh-4)+'" rx="16" fill="'+opts.overlayColor+'" opacity="'+(opts.overlayOpacity!=null?opts.overlayOpacity:0.3)+'"></rect>';
    }
    return '<svg viewBox="0 0 '+vw+' '+vh+'" class="pond-svg">'
      + '<defs><linearGradient id="'+gradId+'" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#DCEAE5"/><stop offset="100%" stop-color="#BEE0D9"/></linearGradient></defs>'
      + '<rect x="2" y="2" width="'+(vw-4)+'" height="'+(vh-4)+'" rx="16" fill="url(#'+gradId+')" stroke="#084F4F" stroke-width="2"></rect>'
      + dots + pending + overlay
      + '</svg>';
  }

  async function loadAll(){
    const [p, c, pob, param, backup, initFlag] = await Promise.all([
      storageGet("piscinas", null), storageGet("ciclos", null), storageGet("poblaciones", null), storageGet("parametros", null),
      storageGet("backupConfig", null), storageGet("appInitialized", false),
    ]);
    if (p === null && !initFlag){
      // primera vez real: no hay banderas de uso previo, se puede sembrar el ejemplo con seguridad
      seedDefaults();
      await Promise.all([
        storageSet("piscinas", state.piscinas), storageSet("ciclos", state.ciclos),
        storageSet("poblaciones", state.poblaciones), storageSet("parametros", state.parametros),
        storageSet("appInitialized", true),
      ]);
    } else if (p === null && initFlag){
      // ya existían datos reales antes, pero esta carga falló: NO sobrescribir con datos de ejemplo
      state.loadError = true;
      state.piscinas = []; state.ciclos = []; state.poblaciones = [];
    } else {
      state.piscinas = p || []; state.ciclos = c || []; state.poblaciones = pob || [];
      state.parametros = Object.assign({}, state.parametros, param || {});
      state.session.piscinaId = state.piscinas[0] ? state.piscinas[0].id : null;
      if (!initFlag) await storageSet("appInitialized", true);
    }
    if (backup) state.backupConfig = Object.assign({}, state.backupConfig, backup);
    if (state.piscinas.length){ state.historialSel.piscinaId = state.piscinas[0].id; }
    state.loaded = true;
  }

  // ---------- helpers de ciclo ----------
  function getCicloActivo(piscinaId){ return state.ciclos.find(c=>c.piscinaId===piscinaId && c.estado==="activo"); }
  function ciclosDePiscina(piscinaId){ return state.ciclos.filter(c=>c.piscinaId===piscinaId).sort((a,b)=>a.numero-b.numero); }
  function getPoblacion(cicloId, fecha){ return state.poblaciones.find(x=>x.cicloId===cicloId && x.fecha===fecha); }
  function emptyCell(){ return {captura:null, profundidad:null}; }
  function ensurePoblacion(cicloId, fecha){
    let pob = getPoblacion(cicloId, fecha);
    if (!pob){
      const ciclo = state.ciclos.find(c=>c.id===cicloId);
      const piscina = ciclo ? state.piscinas.find(p=>p.id===ciclo.piscinaId) : null;
      const efDefault = (piscina && piscina.eficiencia!=null && piscina.eficiencia!=="") ? Number(piscina.eficiencia) : state.parametros.eficiencia;
      pob = {id:uid(), cicloId, fecha, peso:null, eficiencia:efDefault, tieneFoto:false, tiros: Array.from({length:16}, emptyCell)};
      state.poblaciones.push(pob);
    }
    return pob;
  }
  function tirosLlenos(pob){ return pob.tiros.filter(t=>t.captura!=null && t.captura!=="" && !isNaN(Number(t.captura))); }
  function resizeGrid(pob, delta){
    const newLen = Math.max(4, Math.min(32, pob.tiros.length + delta));
    if (newLen < pob.tiros.length){
      const removed = pob.tiros.slice(newLen);
      const hasData = removed.some(t=>t.captura!=null && t.captura!=="");
      if (hasData && !confirm("Algunas celdas que vas a quitar ya tienen datos. ¿Continuar?")) return false;
    }
    while (pob.tiros.length < newLen) pob.tiros.push(emptyCell());
    pob.tiros.length = newLen;
    return true;
  }

  // ---------- cálculo por ciclo: cada "población" = un muestreo con varios tiros de atarraya ----------
  function buildPoblacionesConCalculo(cicloId){
    const ciclo = state.ciclos.find(c=>c.id===cicloId);
    if (!ciclo) return [];
    const piscina = state.piscinas.find(p=>p.id===ciclo.piscinaId);
    const areaAtarraya = Math.PI * Math.pow(state.parametros.radioAtarraya, 2);
    const animalesM2 = ciclo.area ? ciclo.animales/ciclo.area : 0;
    const pobs = state.poblaciones
      .filter(x=>x.cicloId===cicloId)
      .filter(x=> tirosLlenos(x).length>0 || (x.peso!=null && x.peso!=="")) // ocultar poblaciones sin ningún dato registrado
      .sort((a,b)=> a.fecha<b.fecha?-1:1);
    const rows = pobs.map(pob=>{
      const llenos = tirosLlenos(pob);
      const capturas = llenos.map(t=>Number(t.captura));
      const st = stats(capturas);
      const profs = llenos.filter(t=>t.profundidad!=null && t.profundidad!=="").map(t=>Number(t.profundidad));
      const profProm = profs.length ? profs.reduce((a,b)=>a+b,0)/profs.length : null;
      const eficiencia = (pob.eficiencia!=null && pob.eficiencia!=="") ? Number(pob.eficiencia)
        : (piscina && piscina.eficiencia!=null && piscina.eficiencia!=="") ? Number(piscina.eficiencia)
        : state.parametros.eficiencia;
      const areaCorregida = areaAtarraya * eficiencia;
      const camXm2 = (areaCorregida && st.mean!=null) ? st.mean/areaCorregida : null;
      const sobrevivencia = (animalesM2 && camXm2!=null) ? camXm2/animalesM2 : null;
      const diasCultivo = daysBetween(ciclo.fechaSiembra, pob.fecha);
      const peso = (pob.peso!=null && pob.peso!=="") ? Number(pob.peso) : null;
      const biomasa = (peso!=null && camXm2!=null) ? ciclo.area*camXm2*(peso/1000) : null;
      const kgHa = biomasa!=null ? biomasa/(ciclo.area/10000) : null;
      const pares = paresCapturaProfundidad(pob);
      const corr = pearsonCorr(pares.map(t=>Number(t.captura)), pares.map(t=>Number(t.profundidad)));
      return { pob, st, profProm, camXm2, sobrevivencia, diasCultivo, peso, biomasa, kgHa, crecimiento:null, corr, corrAcumulada:null, eficiencia };
    });
    for (let i=1;i<rows.length;i++){
      const prev=rows[i-1], cur=rows[i];
      if (prev.peso!=null && cur.peso!=null){
        const semanas = daysBetween(prev.pob.fecha, cur.pob.fecha)/7;
        cur.crecimiento = semanas>0 ? (cur.peso-prev.peso)/semanas : null;
      }
    }
    // correlación acumulada: se va construyendo con todos los pares captura-profundidad del ciclo hasta cada fecha
    let accCap = [], accProf = [];
    rows.forEach(r=>{
      const pares = paresCapturaProfundidad(r.pob);
      accCap = accCap.concat(pares.map(t=>Number(t.captura)));
      accProf = accProf.concat(pares.map(t=>Number(t.profundidad)));
      r.corrAcumulada = pearsonCorr(accCap, accProf);
    });
    return rows;
  }

  // ---------- gráfica SVG sin dependencias externas ----------
  function svgLineChart(points, opts){
    opts = opts || {};
    const width=300, height=170, pad={l:38,r:10,t:12,b:20};
    const color = opts.color || "#0E7C7B";
    const yFormat = opts.yFormat || (v=>v);
    if (!points.length) return '<div class="empty-state" style="padding:24px 8px;"><p>Sin datos suficientes todavía.</p></div>';
    const xs=points.map(p=>p.x), ys=points.map(p=>p.y);
    const xMin=Math.min(...xs), xMax=Math.max(...xs), yLo=Math.min(...ys), yHi=Math.max(...ys);
    const xRange=(xMax-xMin)||1, yRange=(yHi-yLo)||1;
    const xScale = x => pad.l + (width-pad.l-pad.r) * ((x-xMin)/xRange);
    const yScale = y => (height-pad.b) - (height-pad.t-pad.b) * ((y-yLo)/yRange);
    const linePts = points.map(p=>xScale(p.x).toFixed(1)+","+yScale(p.y).toFixed(1)).join(" ");
    const dots = points.map(p=>'<circle cx="'+xScale(p.x).toFixed(1)+'" cy="'+yScale(p.y).toFixed(1)+'" r="4" fill="'+color+'"></circle>').join("");
    return '<svg viewBox="0 0 '+width+' '+height+'" class="mini-chart">'
      + '<line x1="'+pad.l+'" y1="'+(height-pad.b)+'" x2="'+(width-pad.r)+'" y2="'+(height-pad.b)+'" class="axis"/>'
      + '<line x1="'+pad.l+'" y1="'+pad.t+'" x2="'+pad.l+'" y2="'+(height-pad.b)+'" class="axis"/>'
      + '<polyline points="'+linePts+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'
      + dots
      + '<text x="4" y="'+(pad.t+6)+'" class="axis-label">'+yFormat(yHi)+'</text>'
      + '<text x="4" y="'+(height-pad.b)+'" class="axis-label">'+yFormat(yLo)+'</text>'
      + '<text x="'+pad.l+'" y="'+(height-4)+'" class="axis-label">día '+xMin+'</text>'
      + '<text x="'+(width-pad.r)+'" y="'+(height-4)+'" class="axis-label" text-anchor="end">día '+xMax+'</text>'
      + '</svg>';
  }

  function waterBar(diasCultivo, poblacionDias){
    const cycle = 120;
    const pct = Math.max(3, Math.min(100, (diasCultivo/cycle)*100));
    const ticks = (poblacionDias||[]).map(d=>{
      const tpct = Math.max(0, Math.min(100, (d/cycle)*100));
      return '<div class="waterbar-tick" style="left:'+tpct+'%"></div>';
    }).join("");
    return '<div class="waterbar-cap"><span>Día '+diasCultivo+' de cultivo</span><span>ciclo típico '+cycle+'d</span></div>'
      + '<div class="waterbar"><div class="waterbar-fill" style="width:'+pct+'%"></div>'+ticks+'</div>';
  }

  function pill(ok, text){ return '<span class="pill '+(ok?"good":"warn")+'">'+text+'</span>'; }
  function cvBadge(cv, maxCV){
    if (cv==null) return "";
    return pill(cv<=maxCV, "CV "+fmtNum(cv,1)+"%");
  }

  function renderMuestreoTab(){
    const piscinasConCiclo = state.piscinas.filter(p=>getCicloActivo(p.id));
    if (!piscinasConCiclo.length) return emptyState("No hay piscinas con ciclo activo", "Ve a Piscinas e inicia un ciclo para poder registrar poblaciones.");
    if (!state.session.piscinaId || !getCicloActivo(state.session.piscinaId)) state.session.piscinaId = piscinasConCiclo[0].id;
    const ciclo = getCicloActivo(state.session.piscinaId);
    const diasCultivo = daysBetween(ciclo.fechaSiembra, state.session.fecha);
    const opciones = piscinasConCiclo.map(p=>'<option value="'+p.id+'" '+(p.id===state.session.piscinaId?"selected":"")+'>Piscina '+escapeHtml(p.nombre)+'</option>').join("");

    const pob = ensurePoblacion(ciclo.id, state.session.fecha);
    const llenos = tirosLlenos(pob);
    const st = stats(llenos.map(t=>t.captura));
    const cvOk = st.cv==null || st.cv<=state.parametros.maxCV;
    const capturasLlenas = llenos.map(t=>Number(t.captura));
    const cMin = capturasLlenas.length ? Math.min(...capturasLlenas) : 0;
    const cMax = capturasLlenas.length ? Math.max(...capturasLlenas) : 1;

    const cells = pob.tiros.map((t,i)=>{
      const hasVal = t.captura!=null && t.captura!=="" && !isNaN(Number(t.captura));
      let bg = "rgba(255,255,255,.6)";
      if (hasVal){
        const norm = cMax>cMin ? (Number(t.captura)-cMin)/(cMax-cMin) : 0.5;
        bg = interpolateColor("#FFFFFF", "#8FC7BE", norm);
      }
      return '<div class="grid-cell" style="background:'+bg+'">'
        + '<div class="grid-cell-num">'+(i+1)+'</div>'
        + '<input type="number" inputmode="numeric" class="gc-captura" data-idx="'+i+'" data-field="grid-captura" placeholder="captura" value="'+(t.captura!=null?t.captura:"")+'">'
        + '<input type="number" inputmode="numeric" class="gc-prof" data-idx="'+i+'" data-field="grid-profundidad" placeholder="prof. cm" value="'+(t.profundidad!=null?t.profundidad:"")+'">'
        + '</div>';
    }).join("");

    const pares = paresCapturaProfundidad(pob);
    const profs = pares.map(t=>Number(t.profundidad));
    const profProm = profs.length ? profs.reduce((a,b)=>a+b,0)/profs.length : null;
    const corr = pearsonCorr(pares.map(t=>Number(t.captura)), profs);

    const statsPanel = st.n ? ('<div class="stats-panel">'
        + '<div class="stat-grid cols-3">'
          + '<div class="stat"><div class="value">'+fmtNum(st.mean,2)+'</div><div class="label">Media</div></div>'
          + '<div class="stat"><div class="value">'+fmtNum(st.median,2)+'</div><div class="label">Mediana</div></div>'
          + '<div class="stat"><div class="value">'+fmtModa(st.moda)+'</div><div class="label">Moda</div></div>'
        + '</div>'
        + '<div style="display:flex;align-items:center;justify-content:space-between;margin-top:6px;">'
          + '<span class="legend-note">Desv. est. '+fmtNum(st.std,2)+'</span>'
          + (st.cv!=null ? pill(cvOk, "CV "+fmtNum(st.cv,1)+"%") : "")
        + '</div>'
        + (st.cv!=null ? '<div class="legend-note" style="margin-top:6px;">'+(cvOk?"Datos consistentes: los tiros no varían demasiado entre sí.":"Alta variabilidad entre tiros — revisa si hay tiros atípicos antes de cerrar la población.")+'</div>' : "")
        + '<div class="divider" style="margin:10px 0;"></div>'
        + '<div class="stat-grid">'
          + '<div class="stat"><div class="value">'+(profProm!=null?fmtNum(profProm,1)+" cm":"—")+'</div><div class="label">Profundidad prom.</div></div>'
          + '<div class="stat"><div class="value">'+(corr!=null?fmtNum(corr,2):"—")+'</div><div class="label">Correlación captura-prof.</div></div>'
        + '</div>'
        + '<div class="legend-note">'+corrLabel(corr)+(corr==null?" (registra profundidad en al menos 3 celdas)":"")+'</div>'
      + '</div>') : '<div class="legend-note" style="margin-top:8px;">Llena las celdas de captura para ver media, mediana, moda y CV.</div>';

    return '<div class="card accent">'
      + '<div class="row"><div class="field"><label>Piscina</label><select id="session-piscina">'+opciones+'</select></div>'
      + '<div class="field"><label>Fecha</label><input type="date" id="session-fecha" value="'+state.session.fecha+'"></div></div>'
      + '<div class="legend-note">Ciclo '+ciclo.numero+' · día '+diasCultivo+' de cultivo</div>'
      + '</div>'
      + '<div class="card">'
        + '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">'
          + '<h3 style="font-size:14px;margin:0;">Tabla de la piscina</h3>'
          + '<div style="display:flex;align-items:center;gap:8px;">'
            + '<span class="legend-note">'+pob.tiros.length+' celdas</span>'
            + '<button class="icon-btn" style="width:30px;height:30px;background:var(--surface-2);" data-action="grid-resize" data-delta="-4">−</button>'
            + '<button class="icon-btn" style="width:30px;height:30px;background:var(--surface-2);" data-action="grid-resize" data-delta="4">+</button>'
          + '</div>'
        + '</div>'
        + '</div>'
        + '<div class="field"><label>Pegar capturas de una vez (separadas por espacio, coma o salto de línea)</label>'
          + '<textarea id="bulk-input" rows="2" style="width:100%;padding:10px;border-radius:10px;border:1.5px solid var(--surface-2);font-family:var(--mono);font-size:13px;" placeholder="ej. 120 168 103 100 60 100 105 80"></textarea></div>'
        + '<button class="btn btn-outline btn-sm" style="width:100%;margin-bottom:12px;" data-action="bulk-fill">⚡ Rellenar tabla con estos valores</button>'
        + '<div class="pond-table"><div class="grid-cells">'+cells+'</div></div>'
        + statsPanel
        + '<div class="divider"></div>'
        + '<div class="row"><div class="field"><label>Peso muestreado (g)</label><input type="number" step="0.1" min="0" id="input-peso" value="'+(pob.peso!=null?pob.peso:"")+'" placeholder="ej. 5.8"></div>'
        + '<div class="field"><label>Eficiencia atarraya</label><input type="number" step="0.01" min="0" max="1" id="input-eficiencia" value="'+(pob.eficiencia!=null?pob.eficiencia:"")+'"></div></div>'
        + '<button class="btn btn-secondary" data-action="save-peso">Guardar peso y eficiencia</button>'
        + '<div class="divider"></div>'
        + photoBlockHtml(pob, false)
        + (state.photoStatus ? ('<div class="legend-note" style="margin-top:8px;'+(state.photoStatus.ok?'':'color:var(--red);')+'">'+(state.photoStatus.ok?"✓ ":"⚠ ")+state.photoStatus.msg+'</div>') : "")
      + '</div>';
  }

  function renderResumenTab(){
    const ciclosActivos = state.ciclos.filter(c=>c.estado==="activo");
    if (!ciclosActivos.length) return emptyState("No hay ciclos activos", "Inicia un ciclo en la pestaña Piscinas.");
    const param = state.parametros;
    const nombrePiscina = id => { const p = state.piscinas.find(x=>x.id===id); return p?p.nombre:"?"; };
    let allRows = [];
    ciclosActivos.forEach(ciclo=>{
      buildPoblacionesConCalculo(ciclo.id).forEach(r=>allRows.push(Object.assign({ciclo}, r)));
    });
    if (!allRows.length) return emptyState("Aún no hay poblaciones registradas", "Ve a la pestaña Muestreo para registrar la primera.");
    allRows.sort((a,b)=> a.pob.fecha<b.pob.fecha?1:-1);

    const cards = allRows.map(r=>{
      const sobPill = r.sobrevivencia!=null ? pill(r.sobrevivencia>=param.minSobrevivencia, "Sobrev. "+fmtPct(r.sobrevivencia)) : "";
      const crecPill = r.crecimiento!=null ? pill(r.crecimiento>=param.minCrecimiento, "Crec. "+fmtNum(r.crecimiento,2)+" g/sem") : "";
      const kgHaPill = r.kgHa!=null ? pill(r.kgHa>=param.minKgHa, fmtNum(r.kgHa,0)+" kg/ha") : "";
      const cv = cvBadge(r.st.cv, param.maxCV);
      return '<div class="card accent">'
        + '<div class="card-header"><div><h3>Piscina '+escapeHtml(nombrePiscina(r.ciclo.piscinaId))+'</h3><div class="muted">Ciclo '+r.ciclo.numero+' · '+fmtDate(r.pob.fecha)+' · '+r.st.n+' tiros</div></div></div>'
        + waterBar(r.diasCultivo, null)
        + '<div class="stat-grid" style="margin-top:12px;">'
          + '<div class="stat"><div class="value">'+fmtNum(r.st.mean,2)+'</div><div class="label">Media captura</div></div>'
          + '<div class="stat"><div class="value">'+fmtNum(r.st.median,2)+'</div><div class="label">Mediana</div></div>'
        + '</div>'
        + '<div class="stat-grid">'
          + '<div class="stat"><div class="value">'+fmtModa(r.st.moda)+'</div><div class="label">Moda</div></div>'
          + '<div class="stat"><div class="value">'+fmtNum(r.camXm2,2)+'</div><div class="label">Camarón / m²</div></div>'
        + '</div>'
        + '<div class="stat-grid cols-3">'
          + '<div class="stat"><div class="value">'+(r.profProm!=null?fmtNum(r.profProm,1)+" cm":"—")+'</div><div class="label">Profundidad prom.</div></div>'
          + '<div class="stat"><div class="value">'+(r.corr!=null?fmtNum(r.corr,2):"—")+'</div><div class="label">Correlación captura-prof.</div></div>'
          + '<div class="stat"><div class="value">'+fmtNum(r.eficiencia,2)+'</div><div class="label">Eficiencia usada</div></div>'
        + '</div>'
        + '<div class="field" style="margin-top:6px;"><label>Peso muestreado (g)</label>'
          + '<input type="number" step="0.1" min="0" data-field="peso" data-ciclo="'+r.ciclo.id+'" data-fecha="'+r.pob.fecha+'" value="'+(r.peso!=null?r.peso:"")+'" placeholder="ej. 5.8"></div>'
        + (r.biomasa!=null ? ('<div class="stat-grid"><div class="stat"><div class="value">'+fmtNum(r.biomasa,1)+' kg</div><div class="label">Biomasa</div></div>'
            + '<div class="stat"><div class="value">'+fmtNum(r.kgHa,0)+'</div><div class="label">kg / ha</div></div></div>')
          : '<div class="legend-note">Ingresa el peso para calcular biomasa y kg/ha.</div>')
        + '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;">'+sobPill+kgHaPill+crecPill+cv+'</div>'
        + photoBlockHtml(r.pob, true)
        + '</div>';
    }).join("");

    return '<div class="legend-note" style="margin-bottom:12px;">Verde = cumple tu criterio (sobrevivencia ≥ '+fmtPct(param.minSobrevivencia)+', ≥ '+fmtNum(param.minKgHa,0)+' kg/ha, ≥ '+fmtNum(param.minCrecimiento,1)+' g/sem, CV ≤ '+fmtNum(param.maxCV,0)+'%). Ajustable en Ajustes.</div>' + cards;
  }

  function renderHistorialTab(){
    if (!state.piscinas.length) return emptyState("Primero registra una piscina", "Ve a la pestaña Piscinas y agrega una.");
    if (!state.historialSel.piscinaId) state.historialSel.piscinaId = state.piscinas[0].id;
    const piscinaChips = state.piscinas.map(p=>'<div class="chip '+(p.id===state.historialSel.piscinaId?"active":"")+'" data-action="hist-piscina" data-id="'+p.id+'">Piscina '+escapeHtml(p.nombre)+'</div>').join("");

    const ciclos = ciclosDePiscina(state.historialSel.piscinaId);
    if (!ciclos.length) return '<div class="chip-select">'+piscinaChips+'</div>' + emptyState("Sin ciclos todavía", "Esta piscina aún no tiene ningún ciclo iniciado.");
    if (!state.historialSel.cicloId || !ciclos.find(c=>c.id===state.historialSel.cicloId)) state.historialSel.cicloId = ciclos[ciclos.length-1].id;
    const cicloChips = ciclos.map(c=>{
      const label = "Ciclo "+c.numero+(c.estado==="activo"?" · activo":" · cerrado");
      return '<div class="chip '+(c.id===state.historialSel.cicloId?"active":"")+' '+(c.estado==="cerrado"?"closed-chip":"")+'" data-action="hist-ciclo" data-id="'+c.id+'">'+label+'</div>';
    }).join("");

    const ciclo = ciclos.find(c=>c.id===state.historialSel.cicloId);
    const rows = buildPoblacionesConCalculo(ciclo.id);
    const sobPts = rows.filter(r=>r.sobrevivencia!=null).map(r=>({x:r.diasCultivo, y:r.sobrevivencia}));
    const bioPts = rows.filter(r=>r.biomasa!=null).map(r=>({x:r.diasCultivo, y:r.biomasa}));
    const corrPts = rows.filter(r=>r.corrAcumulada!=null).map(r=>({x:r.diasCultivo, y:r.corrAcumulada}));
    const ultima = rows[rows.length-1];
    const duracion = ciclo.fechaCierre ? daysBetween(ciclo.fechaSiembra, ciclo.fechaCierre) : daysBetween(ciclo.fechaSiembra, todayISO());

    const resumenCiclo = '<div class="card '+(ciclo.estado==="activo"?"accent":"accent-closed")+'">'
      + '<div class="card-header"><div><h3>Ciclo '+ciclo.numero+'</h3><div class="muted">'+fmtDate(ciclo.fechaSiembra)+' — '+(ciclo.fechaCierre?fmtDate(ciclo.fechaCierre):"en curso")+'</div></div>'
      + '<span class="pill '+(ciclo.estado==="activo"?"good":"closed")+'">'+(ciclo.estado==="activo"?"Activo":"Cerrado")+'</span></div>'
      + '<div class="stat-grid">'
        + '<div class="stat"><div class="value">'+duracion+' d</div><div class="label">Duración</div></div>'
        + '<div class="stat"><div class="value">'+fmtNum(ciclo.animales,0)+'</div><div class="label">Animales sembrados</div></div>'
        + '<div class="stat"><div class="value">'+rows.length+'</div><div class="label">Poblaciones</div></div>'
        + '<div class="stat"><div class="value">'+(ultima?fmtPct(ultima.sobrevivencia):"—")+'</div><div class="label">Última sobrevivencia</div></div>'
      + '</div>'
      + (ultima && ultima.corrAcumulada!=null ? '<div class="legend-note" style="margin-top:8px;">Correlación captura-profundidad acumulada del ciclo: <b>'+fmtNum(ultima.corrAcumulada,2)+'</b> — '+corrLabel(ultima.corrAcumulada)+'.</div>' : "")
      + (ciclo.estado==="activo" ? '<button class="btn btn-outline btn-sm" style="margin-top:10px;" data-action="cerrar-ciclo" data-ciclo="'+ciclo.id+'">Cerrar este ciclo</button>' : "");

    const pondStrip = rows.length ? ('<div class="pond-strip">' + rows.map(r=>{
        const ok = r.sobrevivencia!=null && r.sobrevivencia>=state.parametros.minSobrevivencia;
        const overlay = r.sobrevivencia==null ? null : (ok ? "rgba(23,122,69,0.30)" : "rgba(180,83,9,0.30)");
        return '<div class="pond-strip-item">'
          + '<div class="pond-strip-day">Día '+r.diasCultivo+'</div>'
          + pondDiagram(tirosParaDiagrama(r.pob), {width:118, height:78, id:"strip-"+r.pob.id, labels:false, overlayColor:overlay, overlayOpacity:1})
          + '<div class="pond-strip-val">'+fmtPct(r.sobrevivencia)+'</div>'
        + '</div>';
      }).join("") + '</div>') : "";

    const poblacionesList = rows.map(r=>'<div class="card">'
        + '<div class="card-header"><div><h3 style="font-size:14px;">'+fmtDate(r.pob.fecha)+'</h3><div class="muted">Día '+r.diasCultivo+' · '+r.st.n+' tiros</div></div>'+cvBadge(r.st.cv, state.parametros.maxCV)+'</div>'
        + '<div class="pond-wrap" style="max-width:200px;margin:0 auto 10px;">'+pondDiagram(tirosParaDiagrama(r.pob), {width:200, height:126, id:"pob-"+r.pob.id})+'</div>'
        + '<div class="stat-grid cols-3">'
          + '<div class="stat"><div class="value">'+fmtNum(r.st.mean,2)+'</div><div class="label">Media</div></div>'
          + '<div class="stat"><div class="value">'+fmtNum(r.st.median,2)+'</div><div class="label">Mediana</div></div>'
          + '<div class="stat"><div class="value">'+fmtModa(r.st.moda)+'</div><div class="label">Moda</div></div>'
        + '</div>'
        + '<div class="stat-grid">'
          + '<div class="stat"><div class="value">'+fmtPct(r.sobrevivencia)+'</div><div class="label">Sobrevivencia</div></div>'
          + '<div class="stat"><div class="value">'+(r.biomasa!=null?fmtNum(r.biomasa,1)+" kg":"—")+'</div><div class="label">Biomasa</div></div>'
        + '</div>'
        + '<div class="stat-grid cols-3">'
          + '<div class="stat"><div class="value">'+(r.profProm!=null?fmtNum(r.profProm,1)+" cm":"—")+'</div><div class="label">Profundidad prom.</div></div>'
          + '<div class="stat"><div class="value">'+(r.corr!=null?fmtNum(r.corr,2):"—")+'</div><div class="label">Correlación captura-prof.</div></div>'
          + '<div class="stat"><div class="value">'+fmtNum(r.eficiencia,2)+'</div><div class="label">Eficiencia usada</div></div>'
        + '</div>'
        + photoBlockHtml(r.pob, true)
        + '</div>').join("");

    return '<div class="chip-select">'+piscinaChips+'</div>'
      + '<div class="chip-select">'+cicloChips+'</div>'
      + resumenCiclo
      + (pondStrip ? ('<h2 class="section-title" style="margin:16px 2px 8px;">Evolución visual del ciclo</h2>'
          + '<div class="legend-note" style="margin-bottom:8px;">Cada piscina muestra dónde cayeron los tiros de esa población; el color de fondo indica si cumplió tu criterio de sobrevivencia.</div>'
          + pondStrip) : "")
      + '<div class="card"><h2 class="section-title">Sobrevivencia</h2>'+svgLineChart(sobPts,{color:"#0E7C7B", yFormat:v=>(v*100).toFixed(0)+"%"})+'</div>'
      + '<div class="card"><h2 class="section-title">Biomasa (kg)</h2>'+svgLineChart(bioPts,{color:"#B45309", yFormat:v=>fmtNum(v,0)})+'</div>'
      + '<div class="card"><h2 class="section-title">Correlación captura-profundidad (acumulada)</h2>'
        + '<div class="legend-note" style="margin-bottom:6px;">Se recalcula sumando los pares de todas las poblaciones del ciclo hasta cada fecha, así se vuelve más confiable con cada muestreo.</div>'
        + svgLineChart(corrPts,{color:"#0A5C5B", yFormat:v=>fmtNum(v,2)})+'</div>'
      + '<h2 class="section-title" style="margin:6px 2px 10px;">Poblaciones del ciclo</h2>'
      + (poblacionesList || emptyState("Sin poblaciones", "Este ciclo aún no tiene muestreos registrados."));
  }

    openModal('<h3>'+(p?"Editar piscina":"Nueva piscina")+'</h3>'

  async function handleDeletePiscina(id){
    if (!confirm("¿Eliminar esta piscina, sus ciclos y todo su historial? Esta acción no se puede deshacer.")) return;
    const ciclosIds = state.ciclos.filter(c=>c.piscinaId===id).map(c=>c.id);
    state.piscinas = state.piscinas.filter(p=>p.id!==id);
    state.ciclos = state.ciclos.filter(c=>c.piscinaId!==id);
    state.poblaciones = state.poblaciones.filter(x=>!ciclosIds.includes(x.cicloId));
    await Promise.all([storageSet("piscinas", state.piscinas), storageSet("ciclos", state.ciclos), storageSet("poblaciones", state.poblaciones)]);

  async function handleBulkFill(){
    const raw = document.getElementById("bulk-input").value || "";
    const nums = (raw.match(/-?\d+(\.\d+)?/g) || []).map(Number);
    if (!nums.length){ showToast("No encontré números en el texto pegado."); return; }

  function readAndCompressImage(file, maxDim, quality){
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onload = function(e){
        const img = new Image();
        img.onload = function(){
          let w = img.width, h = img.height;
          if (w>h && w>maxDim){ h = Math.round(h*maxDim/w); w = maxDim; }
          else if (h>=w && h>maxDim){ w = Math.round(w*maxDim/h); h = maxDim; }
          const canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          canvas.getContext("2d").drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL("image/jpeg", quality));
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  // comprime en pasadas sucesivas hasta quedar bajo un tamaño seguro (aprox. 700 KB)
  async function compressForStorage(file){
    let maxDim = 800, quality = 0.55;
    let last = null;
    for (let attempt=0; attempt<6; attempt++){
      last = await readAndCompressImage(file, maxDim, quality);
      const approxBytes = Math.round(last.length*0.75);
      if (approxBytes <= 250000) return last;
      quality = Math.max(0.25, quality-0.1);
      maxDim = Math.max(360, Math.round(maxDim*0.75));
    }
    return last;
  }

  function ensurePhotoLoaded(pobId){
    if (state.fotos[pobId]) return;
    state.fotos[pobId] = {status:"loading"};

      state.fotos[pobId] = data ? {status:"ok", data} : {status:"error"};

    });
  }

  function photoBlockHtml(pob, thumbOnly){
    if (pob.foto){ // dato antiguo (guardado directo dentro de poblaciones, versiones anteriores)
      return thumbOnly
        ? '<img class="photo-thumb" style="margin-top:10px;" src="'+pob.foto+'" alt="Foto">'
        : '<div class="photo-preview"><img src="'+pob.foto+'" alt="Foto de la población"><button class="x-btn photo-remove" data-action="remove-photo">×</button></div>';
    }
    if (pob.tieneFoto){
      ensurePhotoLoaded(pob.id);
      const cached = state.fotos[pob.id];
      if (cached && cached.status==="ok"){
        return thumbOnly
          ? '<img class="photo-thumb" style="margin-top:10px;" src="'+cached.data+'" alt="Foto">'
          : '<div class="photo-preview"><img src="'+cached.data+'" alt="Foto de la población"><button class="x-btn photo-remove" data-action="remove-photo">×</button></div>';
      }
      if (cached && cached.status==="error") return thumbOnly ? "" : '<div class="legend-note">No se pudo cargar la foto guardada.</div>';
      return thumbOnly ? "" : '<div class="legend-note">Cargando foto…</div>';
    }
    return thumbOnly ? "" : '<label class="btn btn-outline photo-btn">📷 Tomar foto de la población<input type="file" accept="image/*" capture="environment" id="photo-input" style="display:none;"></label>';
  }

  async function handlePhotoSelected(inputEl){
    const file = inputEl.files && inputEl.files[0];
    if (!file) return;
    state.photoStatus = null;
    showToast("Procesando foto…");
    try{
      const dataUrl = await compressForStorage(file);
      const ciclo = getCicloActivo(state.session.piscinaId);
      if (!ciclo){ state.photoStatus = {ok:false, msg:"No hay ciclo activo para esta piscina."}; render(); return; }
      const pob = ensurePoblacion(ciclo.id, state.session.fecha);
      const savedFoto = await storageSet("foto_"+pob.id, dataUrl);
      if (!savedFoto){
        state.photoStatus = {ok:false, msg:"No se pudo guardar la foto (puede ser muy pesada). Intenta con otra toma."};
        render(); inputEl.value=""; return;
      }
      pob.tieneFoto = true;
      const savedPob = await storageSet("poblaciones", state.poblaciones);
      if (!savedPob){
        state.photoStatus = {ok:false, msg:"La foto se guardó, pero no se pudo actualizar la población. Vuelve a intentar."};
        render(); inputEl.value=""; return;
      }
      // verificación: releer de storage para confirmar que la foto quedó guardada de verdad
      const check = await storageGet("foto_"+pob.id, null);
      if (check){
        state.fotos[pob.id] = {status:"ok", data:dataUrl};
        state.photoStatus = {ok:true, msg:"Foto guardada y verificada."};
      } else {
        state.photoStatus = {ok:false, msg:"La foto se procesó pero no se pudo confirmar el guardado. Vuelve a intentarlo."};
      }
      render();
    }catch(err){
      console.error(err);
      state.photoStatus = {ok:false, msg:"No se pudo procesar la foto en este dispositivo."};
      render();
    }
    inputEl.value = "";
  }

    if (!r2.ok){
      lines.push("✗ Prueba de ~300 KB (guardar): "+r2.error);

      lines.push(back2 && back2.relleno && back2.relleno.length===300000 ? "✓ Prueba de ~300 KB: guardó y leyó correctamente." : "✗ Prueba de ~300 KB: guardó pero no leyó de vuelta completo.");

  // ---------- respaldo en la nube (Google Sheets vía Apps Script Web App) ----------
  function normalizePiscinaCloud(p){ return {id:String(p.id), nombre:String(p.nombre), area:Number(p.area)}; }
  function normalizeCicloCloud(c){
    return { id:String(c.id), piscinaId:String(c.piscinaId), numero:Number(c.numero),
      fechaSiembra:String(c.fechaSiembra).slice(0,10), animales:Number(c.animales), area:Number(c.area),
      estado:String(c.estado)==="cerrado"?"cerrado":"activo",
      fechaCierre: c.fechaCierre ? String(c.fechaCierre).slice(0,10) : null };
  }
  function normalizePoblacionCloud(p){
    let tiros = [];
    try{ tiros = typeof p.tiros === "string" ? JSON.parse(p.tiros) : (p.tiros||[]); }catch(e){ tiros = []; }
    return { id:String(p.id), cicloId:String(p.cicloId), fecha:String(p.fecha).slice(0,10),
      peso: (p.peso===""||p.peso==null) ? null : Number(p.peso),
      tiros: tiros.map(t=>({ captura: (t.captura==null||t.captura==="") ? null : Number(t.captura),
        profundidad: (t.profundidad==null||t.profundidad==="") ? null : Number(t.profundidad) })) };
  }

  async function handleBackupNow(){
    const urlEl = document.getElementById("set-backup-url");
    const url = (urlEl ? urlEl.value : (state.backupConfig.url||"")).trim();
    if (!url){ showToast("Ingresa la URL de tu Apps Script."); return; }
    showToast("Respaldando en Google Sheets…");
    try{
      const payload = { piscinas: state.piscinas, ciclos: state.ciclos,
        poblaciones: state.poblaciones.map(p=>({id:p.id, cicloId:p.cicloId, fecha:p.fecha, peso:p.peso, tiros:p.tiros})),
        parametros: state.parametros };
      const res = await fetch(url, { method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify(payload) });
      const json = await res.json().catch(()=>null);
      if (!res.ok || (json && json.ok===false)) throw new Error("respuesta inválida");
      state.backupConfig.url = url;
      state.backupConfig.lastBackup = new Date().toISOString();
      await storageSet("backupConfig", state.backupConfig);
      showToast("Respaldo guardado en Google Sheets.");
      openSettingsModal();
    }catch(err){
      console.error(err);
      showToast("No se pudo respaldar. Revisa la URL y que el despliegue tenga acceso 'Cualquier usuario'.");
    }
  }

  async function handleRestoreCloud(){
    const urlEl = document.getElementById("set-backup-url");
    const url = (urlEl ? urlEl.value : (state.backupConfig.url||"")).trim();
    if (!url){ showToast("Ingresa la URL de tu Apps Script."); return; }
    if (!confirm("Esto reemplazará TODOS tus datos locales (piscinas, ciclos, poblaciones) con lo guardado en Google Sheets. ¿Continuar?")) return;
    showToast("Restaurando desde Google Sheets…");
    try{
      const res = await fetch(url, { method:"GET" });
      const data = await res.json();
      if (Array.isArray(data.piscinas)) state.piscinas = data.piscinas.map(normalizePiscinaCloud);
      if (Array.isArray(data.ciclos)) state.ciclos = data.ciclos.map(normalizeCicloCloud);
      if (Array.isArray(data.poblaciones)) state.poblaciones = data.poblaciones.map(normalizePoblacionCloud);
      if (data.parametros && typeof data.parametros==="object") state.parametros = Object.assign({}, state.parametros, data.parametros);
      await Promise.all([
        storageSet("piscinas", state.piscinas), storageSet("ciclos", state.ciclos),
        storageSet("poblaciones", state.poblaciones), storageSet("parametros", state.parametros),
      ]);
      state.backupConfig.url = url;
      await storageSet("backupConfig", state.backupConfig);
      closeModal(); showToast("Datos restaurados desde Google Sheets."); render();
    }catch(err){
      console.error(err);
      showToast("No se pudo restaurar. Revisa la URL y que ya exista un respaldo previo.");
    }
  }

        const prof = document.querySelector('.gc-prof[data-idx="'+idx+'"]');
        if (prof) prof.focus();
      } else {
        const nextCap = document.querySelector('.gc-captura[data-idx="'+(idx+1)+'"]');
        if (nextCap) nextCap.focus(); else e.target.blur();
      }
    }
  });

  (async function init(){
    document.getElementById("content").innerHTML = '<div class="empty-state"><p>Cargando datos…</p></div>';
    const savedConfig = localStorage.getItem("fb_config");
    const savedFarmId = localStorage.getItem("fb_farmId");
    if (savedConfig && savedFarmId){
      let parsed;
      try{ parsed = JSON.parse(savedConfig); }catch(e){ parsed = null; }
      const r = parsed ? await tryConnectFirebase(parsed, savedFarmId) : {ok:false, error:"Configuración guardada inválida."};
      if (!r.ok){ renderFirebaseSetup("No se pudo conectar automáticamente: "+r.error); return; }
    } else {
      renderFirebaseSetup(null);
      return;
    }
    await loadAll();
    if (state.loadError){
      document.getElementById("content").innerHTML = '<div class="empty-state">'
        + '<svg viewBox="0 0 24 24" stroke-width="1.5" fill="none" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16h.01"></path></svg>'
        + '<p style="font-weight:600;color:var(--ink);">No se pudo cargar tus datos guardados</p>'
        + '<p>Ya tenías información registrada antes, así que por seguridad no se reemplazó con datos de ejemplo. Revisa tu conexión e intenta de nuevo.</p>'
        + '<button class="btn btn-primary" style="width:auto;padding:12px 22px;margin-top:10px;" data-action="retry-load">Reintentar</button>'
        + '</div>';
      return;
    }
    render();
  })();
})();
</script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){});
    });
  }
</script>
</body>
</html>
